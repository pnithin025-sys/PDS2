{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="card" style="max-width:550px;margin:60px auto;text-align:center;padding:50px 30px;">
  <div style="font-size:72px;font-weight:900;color:var(--primary);line-height:1;margin-bottom:12px;">404</div>
  <h4 style="margin-bottom:10px;">Page Not Found</h4>
  <p class="text-muted" style="margin-bottom:24px;">The page you requested does not exist or may have been relocated.</p>
  <div>
    <a href="{{ url_for('analytics.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house-door"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
