{% extends "base.html" %}
{% block title %}403 — Access Forbidden{% endblock %}
{% block page_title %}Access Denied{% endblock %}

{% block content %}
<div class="card" style="max-width:550px;margin:60px auto;text-align:center;padding:50px 30px;">
  <div style="font-size:72px;font-weight:900;color:var(--danger);line-height:1;margin-bottom:12px;">403</div>
  <h4 style="margin-bottom:10px;">Access Forbidden</h4>
  <p class="text-muted" style="margin-bottom:24px;">You do not have the required permissions or role privileges to view this resource.</p>
  <div>
    <a href="{{ url_for('analytics.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-shield-shaded"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
